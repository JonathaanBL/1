# Builds the TikTok link-in-bio page in tiktok/ and the sample business sites in
# webs-muestra/, and publishes both to the gh-pages branch, which GitHub Pages
# serves at https://jonathaanbl.github.io/1/ (samples under /m/<slug>/).
name: Deploy TikTok page

on:
  push:
    branches: [claude/link-in-bio]
    paths:
      - "tiktok/**"
      - "webs-muestra/**"
      - ".github/workflows/deploy-tiktok.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-tiktok
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiktok/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Build sample sites into dist/m
        run: node ../webs-muestra/generar.mjs && cp -r ../webs-muestra/sitios dist/m

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tiktok/dist
          publish_branch: gh-pages
          commit_message: Publish the TikTok page and sample sites
