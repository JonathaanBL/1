<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Térmica iMac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* HUD layout: arc-reactor gauge for the CPU in the centre, readouts on the side, 30-minute trace below. */
:root {
  --fondo: #03070d; --panel: #071321; --linea: #12385a; --tinta: #d8f3ff; --suave: #6f9bb8;
  --cian: #4fd1ff; --tibio: #ffb547; --caliente: #ff4d5e; --estado: var(--cian);
  --titulo: "Rajdhani", "Avenir Next Condensed", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(90% 70% at 50% 30%, #0a1f36 0%, var(--fondo) 70%); color: var(--tinta); font: 15px/1.5 var(--mono);
  padding: 20px max(16px, env(safe-area-inset-left)); display: grid; grid-template-rows: auto 1fr auto; gap: 18px; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background: linear-gradient(rgb(79 209 255 / .05) 1px, transparent 1px) 0 0 / 100% 4px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--linea); padding-bottom: 10px; }
h1 { margin: 0; font: 700 26px var(--titulo); letter-spacing: .25em; text-transform: uppercase; color: var(--cian); text-shadow: 0 0 18px rgb(79 209 255 / .5); }
.meta { color: var(--suave); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; display: flex; gap: 16px; flex-wrap: wrap; }
.punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--estado); box-shadow: 0 0 10px var(--estado); margin-right: 6px; animation: latido 1.6s ease-in-out infinite; }
@keyframes latido { 50% { opacity: .3; } }
main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.reactor { position: relative; width: min(100%, 520px); aspect-ratio: 1; margin-inline: auto; }
.reactor svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.anillo { transform-origin: 50% 50%; animation: girar var(--vel, 24s) linear infinite; }
.anillo.inverso { animation-direction: reverse; }
@keyframes girar { to { transform: rotate(360deg); } }
.centro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.lectura { font: 700 clamp(56px, 13vw, 112px)/1 var(--titulo); color: var(--estado); text-shadow: 0 0 30px color-mix(in srgb, var(--estado) 60%, transparent); font-variant-numeric: tabular-nums; }
.lectura small { font-size: .35em; color: var(--suave); margin-left: 4px; }
.etiqueta { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--suave); }
.estado { margin-top: 6px; font: 600 18px var(--titulo); letter-spacing: .3em; text-transform: uppercase; color: var(--estado); }
.lado { display: grid; gap: 14px; }
.tarjeta { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--linea); border-radius: 4px; padding: 14px 16px; position: relative;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
.tarjeta h2 { margin: 0 0 8px; font: 600 13px var(--titulo); letter-spacing: .3em; text-transform: uppercase; color: var(--suave); }
.fila { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.grande { font: 700 38px/1 var(--titulo); font-variant-numeric: tabular-nums; }
.barra { height: 6px; background: #0c2238; border-radius: 3px; overflow: hidden; margin-top: 10px; }
.barra i { display: block; height: 100%; width: 0; background: var(--c, var(--cian)); box-shadow: 0 0 12px var(--c, var(--cian)); transition: width .8s ease, background .8s; }
.ventiladores { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.ventiladores div { display: flex; justify-content: space-between; }
.aviso { display: none; border-color: var(--caliente); color: var(--caliente); }
.aviso.visible { display: block; }
.grafico { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--linea); border-radius: 4px; padding: 12px 16px 8px; }
.grafico .fila { flex-wrap: wrap; font-size: 12px; color: var(--suave); letter-spacing: .15em; text-transform: uppercase; }
.leyenda span::before { content: ""; display: inline-block; width: 18px; height: 2px; margin: 0 6px 3px 14px; background: var(--c); vertical-align: middle; }
canvas { display: block; width: 100%; height: 160px; }
body.caliente .reactor { animation: alerta 1s ease-in-out infinite; }
@keyframes alerta { 50% { filter: drop-shadow(0 0 24px var(--caliente)); } }
@media (prefers-reduced-motion: reduce) { .anillo, .punto, body.caliente .reactor { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Térmica · iMac</h1>
  <div class="meta"><span><span class="punto"></span><span id="conexion">Conectando…</span></span><span id="reloj"></span></div>
</header>

<main>
  <div class="reactor" aria-live="polite">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <filter id="brillo"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g class="anillo" style="--vel: 40s"><circle cx="100" cy="100" r="96" fill="none" stroke="#12385a" stroke-width=".6" stroke-dasharray="1 3"/></g>
      <g class="anillo inverso" id="anilloA" style="--vel: 22s"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--estado)" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="30 10 4 10"/></g>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#0c2238" stroke-width="7"/>
      <circle id="arco" cx="100" cy="100" r="78" fill="none" stroke="var(--estado)" stroke-width="7" stroke-linecap="round"
        transform="rotate(135 100 100)" stroke-dasharray="0 999" filter="url(#brillo)" style="transition: stroke-dasharray .8s ease"/>
      <g id="marcas"></g>
      <g class="anillo" id="anilloB" style="--vel: 14s"><circle cx="100" cy="100" r="64" fill="none" stroke="var(--estado)" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="2 6"/></g>
      <circle cx="100" cy="100" r="56" fill="url(#nucleo)" opacity=".9"/>
      <radialGradient id="nucleo"><stop offset="0" stop-color="var(--estado)" stop-opacity=".22"/><stop offset="1" stop-color="var(--estado)" stop-opacity="0"/></radialGradient>
    </svg>
    <div class="centro">
      <div>
        <div class="etiqueta">Procesador</div>
        <div class="lectura"><span id="cpu">--</span><small>°C</small></div>
        <div class="estado" id="estado">—</div>
      </div>
    </div>
  </div>

  <div class="lado">
    <div class="tarjeta aviso" id="aviso" role="alert"></div>
    <div class="tarjeta">
      <h2>Gráfica</h2>
      <div class="fila"><span class="grande" id="gpu">--</span><span id="gpuEstado" class="etiqueta"></span></div>
      <div class="barra"><i id="gpuBarra"></i></div>
    </div>
    <div class="tarjeta">
      <h2>Ventiladores</h2>
      <div class="ventiladores" id="ventiladores"><div>Sin datos</div></div>
    </div>
    <div class="tarjeta" id="otrasTarjeta" hidden>
      <h2>Otros sensores</h2>
      <div class="ventiladores" id="otras"></div>
    </div>
    <div class="tarjeta">
      <h2>Carga del procesador</h2>
      <div class="fila"><span class="grande" id="carga">--</span><span class="etiqueta" id="nucleos"></span></div>
      <div class="barra"><i id="cargaBarra"></i></div>
    </div>
    <div class="tarjeta">
      <h2>Encendido hace</h2>
      <div class="grande" id="encendido">--</div>
    </div>
  </div>
</main>

<section class="grafico">
  <div class="fila"><span>Últimos 30 minutos</span><span class="leyenda"><span style="--c: var(--cian)">Procesador</span><span style="--c: #b98cff">Gráfica</span></span></div>
  <canvas id="traza"></canvas>
</section>

<script>
// Thresholds for a 2011 iMac (Sandy Bridge CPU, Radeon HD 6000 GPU).
const UMBRAL = { cpu: [70, 85], gpu: [75, 90] };
const ESCALA = { min: 30, max: 100 };
const $ = (id) => document.getElementById(id);
const nivel = (v, [tibio, caliente]) => v == null ? 0 : v >= caliente ? 2 : v >= tibio ? 1 : 0;
const COLOR = ["var(--cian)", "var(--tibio)", "var(--caliente)"];
const NOMBRE = ["Normal", "Tibio", "Caliente"];

// Tick marks around the gauge every 10 °C.
const marcas = $("marcas");
for (let g = ESCALA.min; g <= ESCALA.max; g += 10) {
  const a = (135 + (g - ESCALA.min) / (ESCALA.max - ESCALA.min) * 270) * Math.PI / 180;
  const x = (r) => 100 + Math.cos(a) * r, y = (r) => 100 + Math.sin(a) * r;
  marcas.insertAdjacentHTML("beforeend",
    `<line x1="${x(70)}" y1="${y(70)}" x2="${x(73)}" y2="${y(73)}" stroke="#6f9bb8" stroke-width=".8"/>` +
    `<text x="${x(64)}" y="${y(64) + 2}" fill="#6f9bb8" font-size="5.5" text-anchor="middle" font-family="JetBrains Mono, monospace">${g}</text>`);
}
const LARGO_ARCO = 2 * Math.PI * 78 * 0.75;

function pintarCpu(t) {
  const n = nivel(t, UMBRAL.cpu);
  document.documentElement.style.setProperty("--estado", COLOR[n]);
  document.body.classList.toggle("caliente", n === 2);
  $("cpu").textContent = t == null ? "--" : t.toFixed(0);
  $("estado").textContent = t == null ? "—" : NOMBRE[n];
  const f = t == null ? 0 : Math.min(1, Math.max(0, (t - ESCALA.min) / (ESCALA.max - ESCALA.min)));
  $("arco").setAttribute("stroke-dasharray", `${f * LARGO_ARCO} 999`);
  // Rings spin faster as the CPU heats up.
  $("anilloA").style.setProperty("--vel", `${22 - f * 16}s`);
  $("anilloB").style.setProperty("--vel", `${14 - f * 10}s`);
  $("aviso").classList.toggle("visible", n === 2);
  $("aviso").textContent = n === 2 ? `Procesador a ${t.toFixed(0)} °C. Revisa que las rejillas de ventilación de atrás no estén tapadas y cierra lo que no uses.` : "";
}

function duracion(desde) {
  if (!desde) return "--";
  let s = Math.max(0, Date.now() / 1000 - desde);
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60);
  return (d ? `${d} d ` : "") + `${h} h ${String(m).padStart(2, "0")} min`;
}

function pintarTraza(hist) {
  const c = $("traza"), d = devicePixelRatio || 1;
  c.width = c.clientWidth * d; c.height = c.clientHeight * d;
  const g = c.getContext("2d"); g.scale(d, d);
  const w = c.clientWidth, h = c.clientHeight, izq = 32;
  const y = (v) => h - 6 - (v - ESCALA.min) / (ESCALA.max - ESCALA.min) * (h - 12);
  g.font = "10px JetBrains Mono, monospace"; g.fillStyle = "#6f9bb8"; g.strokeStyle = "#12385a"; g.lineWidth = 1;
  for (let v = 40; v <= 100; v += 20) { g.beginPath(); g.moveTo(izq, y(v)); g.lineTo(w, y(v)); g.stroke(); g.fillText(v + "°", 0, y(v) + 3); }
  g.setLineDash([4, 4]); g.strokeStyle = "rgb(255 77 94 / .6)";
  g.beginPath(); g.moveTo(izq, y(UMBRAL.cpu[1])); g.lineTo(w, y(UMBRAL.cpu[1])); g.stroke(); g.setLineDash([]);
  if (hist.length < 2) return;
  const t0 = Date.now() / 1000 - 1800;
  const x = (t) => izq + Math.max(0, (t - t0) / 1800) * (w - izq);
  for (const [clave, color] of [["gpu", "#b98cff"], ["cpu", "#4fd1ff"]]) {
    g.beginPath(); let empezado = false;
    for (const p of hist) {
      if (p[clave] == null) continue;
      empezado ? g.lineTo(x(p.t), y(p[clave])) : g.moveTo(x(p.t), y(p[clave])); empezado = true;
    }
    g.strokeStyle = color; g.lineWidth = 2; g.shadowColor = color; g.shadowBlur = 8; g.stroke(); g.shadowBlur = 0;
  }
}

async function actualizar() {
  try {
    const r = await fetch("/api/datos", { cache: "no-store" });
    const datos = await r.json();
    const a = datos.actual;
    $("conexion").textContent = datos.error ? "Error: " + datos.error : datos.demo ? "Modo prueba (datos simulados)" : "En vivo" + (a && a.fuente ? " · " + a.fuente : "");
    if (a) {
      pintarCpu(a.cpu);
      const ng = nivel(a.gpu, UMBRAL.gpu);
      $("gpu").textContent = a.gpu == null ? "--" : a.gpu.toFixed(0) + " °C";
      $("gpuEstado").textContent = a.gpu == null ? "Sin sensor" : NOMBRE[ng];
      $("gpuBarra").style.width = a.gpu == null ? 0 : Math.min(100, (a.gpu - ESCALA.min) / (ESCALA.max - ESCALA.min) * 100) + "%";
      $("gpuBarra").style.setProperty("--c", COLOR[ng]);
      const v = a.ventiladores || [];
      $("ventiladores").innerHTML = v.length ? v.map((rpm, i) => `<div><span>${v.length > 1 ? "Ventilador " + (i + 1) : "Ventilador"}</span><span>${Math.round(rpm)} rpm</span></div>`).join("") : "<div>Sin datos</div>";
      const otras = Object.entries(a.otras || {});
      $("otrasTarjeta").hidden = !otras.length;
      $("otras").innerHTML = otras.map(([n, t]) => `<div><span>${n}</span><span>${t.toFixed(0)} °C</span></div>`).join("");
      $("carga").textContent = a.carga + " %";
      $("nucleos").textContent = a.nucleos + " núcleos";
      $("cargaBarra").style.width = Math.min(100, a.carga) + "%";
      $("cargaBarra").style.setProperty("--c", a.carga > 90 ? COLOR[2] : a.carga > 60 ? COLOR[1] : COLOR[0]);
      $("encendido").textContent = duracion(a.encendidoDesde);
    }
    pintarTraza(datos.historial || []);
  } catch {
    $("conexion").textContent = "Sin conexión con monitor.py";
  }
}

setInterval(() => { $("reloj").textContent = new Date().toLocaleTimeString("es-CL"); }, 1000);
actualizar(); setInterval(actualizar, 2000);
addEventListener("resize", actualizar);
</script>
</body>
</html>
